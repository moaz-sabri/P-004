<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#246a5d"/>
      <stop offset="100%" stop-color="#14463d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#c99738"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Daftar emblem: an open notebook with a bookmark -->
  <g filter="url(#shadow)" transform="translate(40, 36)">
    <path d="M55 70 Q216 28 377 70 V315 Q216 275 55 315 Z" fill="#ffffff"/>
    <path d="M216 70 V315" stroke="#d8c27b" stroke-width="10"/>
    <path d="M82 102 Q150 84 190 96 M82 140 Q150 122 190 134 M242 96 Q300 84 350 102 M242 134 Q300 122 350 140" fill="none" stroke="#246a5d" stroke-width="9" stroke-linecap="round"/>
    <path d="M300 70 V198 L327 174 L354 198 V70" fill="url(#goldGrad)"/>
  </g>
</svg>
