services:
  web:
    image: nginx:alpine
    container_name: studio_planner_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - studio_network

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: studio_planner_php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-studio_planner}
      DB_USER: ${DB_USER:-studio_user}
      DB_PASSWORD: ${DB_PASSWORD:-studio_secure_pass_2026}
      AUTH_SECRET: ${AUTH_SECRET:-studio_secret_key_change_in_production_894872918237}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - studio_network

  db:
    image: mysql:8.0
    container_name: studio_planner_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-studio_root_pass_2026}
      MYSQL_DATABASE: ${DB_NAME:-studio_planner}
      MYSQL_USER: ${DB_USER:-studio_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-studio_secure_pass_2026}
    # MySQL remains private to the Docker network. Use a local override file if needed.
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-studio_root_pass_2026}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - studio_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: studio_planner_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8081}:80"
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - studio_network

networks:
  studio_network:
    driver: bridge

volumes:
  db_data:
    driver: local
